<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>国自然结题报告下载</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="bg-glow bg-glow-a"></div>
    <div class="bg-glow bg-glow-b"></div>

    <div class="app">
        <header class="topbar">
            <div class="brand">
                <img src="images/logo128.png" alt="" class="brand-logo">
                <div class="brand-text">
                    <h1>国自然结题报告下载</h1>
                    <p>kd.nsfc.cn 报告导出 · 自动识别验证码 · 断点续传</p>
                </div>
            </div>
            <div class="topbar-right">
                <a
                    class="repo-link"
                    href="https://github.com/ejfkdev/NsfcReportExport"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="NsfcReportExport 开源项目"
                >
                    <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/>
                    </svg>
                    <span>开源项目</span>
                </a>
                <span class="queue-state" id="queueState">空闲</span>
            </div>
        </header>

        <main class="layout">
            <aside class="sidebar">
                <section class="card composer">
                    <div class="card-head">
                        <h2>新建下载</h2>
                        <span class="hint">链接 / ID 混排</span>
                    </div>
                    <textarea
                        id="batchInput"
                        spellcheck="false"
                        placeholder="粘贴报告链接或 32 位报告 ID，支持多行：&#10;https://kd.nsfc.cn/finalDetails?id=ba5870a1ffaf48d2761d13615a535944&#10;161cd5723f90c0d39423fb838e32f809"
                    ></textarea>
                    <div class="composer-foot">
                        <span class="parse-hint" id="parseHint">等待粘贴…</span>
                        <div class="composer-actions">
                            <button class="btn ghost" id="addOnly">仅添加</button>
                            <button class="btn primary" id="addStart">添加并开始</button>
                        </div>
                    </div>
                </section>

                <section class="card task-panel">
                    <div class="card-head">
                        <h2>任务列表</h2>
                        <span class="hint" id="taskCount">0</span>
                    </div>
                    <div class="task-list" id="taskList"></div>
                </section>
            </aside>

            <section class="card detail" id="detail"></section>
        </main>

        <footer class="footer">
            <p>
                仅供个人学习研究使用，请遵守国家自然科学基金委员会相关规定。
                数据来源 kd.nsfc.cn，本工具不存储任何报告内容，图片缓存在你的浏览器本地。
            </p>
            <p class="footer-links">
                <a
                    href="https://github.com/ejfkdev/NsfcReportExport"
                    target="_blank"
                    rel="noopener noreferrer"
                >NsfcReportExport 开源项目</a>
                <span>·</span>
                <span>
                    by
                    <a
                        href="https://github.com/ejfkdev"
                        target="_blank"
                        rel="noopener noreferrer"
                    >ejfkdev</a>
                </span>
            </p>
            <div class="social">
                <a
                    href="https://github.com/ejfkdev"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="GitHub"
                    title="GitHub @ejfkdev"
                >
                    <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
                        <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/>
                    </svg>
                </a>
                <a
                    href="https://www.xiaohongshu.com/user/profile/65559773000000001103ecc4"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="小红书"
                    title="小红书 @ejfkdev"
                >
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
                        <rect width="24" height="24" rx="5" fill="currentColor"/>
                        <text x="12" y="16" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="6.8" font-weight="600" fill="#ffffff">小红书</text>
                    </svg>
                </a>
                <a
                    href="https://weibo.com/ejfkdev"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="微博"
                    title="微博 @ejfkdev"
                >
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
                        <path fill="currentColor" fill-rule="evenodd" d="M2 16.2 C2 12.8 6.6 10 12.1 10 C17 10 20.8 12.1 20.8 15 C20.8 18.4 16.1 20.8 11 20.8 C5.9 20.8 2 19.5 2 16.2 Z M8.8 15 a2.2 2.2 0 1 0 4.4 0 a2.2 2.2 0 1 0 -4.4 0 Z"/>
                        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M15 4 A4 4 0 0 1 19 8 M15 1 A7 7 0 0 1 22 8"/>
                    </svg>
                </a>
            </div>
        </footer>
    </div>

    <div id="modalRoot"></div>
    <div id="toastRoot"></div>

    <script src="dashboard.js"></script>
</body>
</html>
